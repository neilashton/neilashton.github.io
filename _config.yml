  - CNAME
  - .nojekyll

plugins:
  - jekyll-email-protect
  - jekyll/scholar
  - jekyll-sitemap

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed
  sourcemap: never

# Publications
scholar:
  last_name:
    - Ashton
  first_name:
    - Neil
    - N.
    - N
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  details_link: false
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

filtered_bibtex_keywords:
  - abbr
  - abstract
  - altmetric
  - arxiv
  - bibtex_show
  - blog
  - code
  - dimensions
  - html
  - google_scholar_id
  - pdf
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website

max_author_limit: 5
enable_publication_thumbnails: true
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false

enable_math: false
enable_masonry: false
enable_progressbar: false
enable_medium_zoom: false
enable_tooltips: false
