# Site identity
title: Neil Ashton
homepage_meta_title: Neil Ashton | Computational Engineering
first_name: Neil
last_name: Ashton
email: contact@neilashton.co.uk
description: Neil Ashton's research develops AI methods for computational engineering, including scientific machine learning, foundation models, agentic workflows, and computational fluid dynamics.
keywords: Neil Ashton, computational fluid dynamics, scientific machine learning, computational engineering, foundation models, agentic AI, CFD, CAE, high-performance computing
lang: en-GB
timezone: America/Los_Angeles
icon: favicon.svg

