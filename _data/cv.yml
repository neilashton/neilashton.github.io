    description: >-
      Helps direct the international aerospace benchmarking programme and leads
      its work on machine-learning datasets, evaluation, and physically
      meaningful model comparison.
    pdf_description: >-
      Directs aerospace benchmarking and leads machine-learning data and
      evaluation activities.

  - title: CAE ML Datasets
    role: Research lead and collaborator
