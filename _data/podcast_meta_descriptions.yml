# Curated search descriptions for first-party podcast episode pages.
# Keep every value unique, 140–160 characters long, and a complete sentence.
s1-e1: "Neil Ashton introduces his podcast on AI, CFD and computational engineering, outlining its expert guests, technical themes and practical career insights."
s1-e2: "Florian Menter explains the origins of the k-ω SST turbulence model, the future of RANS and LES, and how machine learning could reshape practical CFD."
s1-e3: "Tony Purnell traces a career spanning Formula 1, Jaguar, the FIA and British Cycling, revealing how engineering and leadership drive elite performance."
s1-e4: "Neil Ashton answers four career questions for engineers, comparing PhDs, academia, industry and technology roles while sharing lessons from Formula 1."
s1-e5: "Dimitris Katsanis explains how aerodynamics, materials, rider interaction and UCI rules shape the design of the world’s fastest racing bicycles."
s1-e6: "Juan Alonso explores the future of CFD and computational science, from GPUs and cloud computing to machine learning, open source and digital twins."
s1-e7: "Pat Symonds reflects on a legendary Formula 1 career, exploring engineering leadership, team culture, cost caps and the sport’s technological future."
s1-e8: "Jack Dongarra charts the evolution of high-performance computing, explaining its scientific impact, global competition and the technologies ahead."
s1-e9: "NASA’s Chris Rumsey explores CFD validation, turbulence modelling, high-lift prediction and certification by analysis, alongside lessons from his career."
s1-e10: "Neil Ashton examines what AI for science can and cannot do, comparing data-driven and physics-informed methods for simulation and discovery."
s1-e11: "Max Welling explores how machine learning can transform science, discussing foundation models, open research, sustainability and responsible innovation."
s1-e12: "Karthik Duraisamy explains how foundation models, neural operators and specialised agents could transform CFD, turbulence modelling and engineering."
s1-e13: "Anima Anandkumar explores AI for science, neural operators and weather prediction, explaining how scientific knowledge can guide scalable learning systems."
s1-e14: "Neil Ashton revisits Season 1’s lessons across CFD, AI, Formula 1, cycling and HPC, then previews the engineering questions planned for Season 2."

s2-e1: "Nikolas Tombazis explores Formula 1’s rules, safety and engineering, explaining how aerodynamics, technology and team dynamics shape the sport’s future."
s2-e2: "Neil Ashton identifies five forces reshaping CFD: GPUs, AI, cloud computing, higher-fidelity certification and consolidation across simulation software."
s2-e3: "Michael Hutchinson explores cycling aerodynamics, training, equipment and regulation, sharing a lifelong pursuit of speed as a rider, writer and engineer."
s2-e4: "Antony Jameson recounts the algorithms and flow codes that transformed CFD, connecting numerical methods, aerodynamic design and decades of innovation."
s2-e5: "NASA’s Peter Coen explains how the X-59 could enable quieter supersonic flight, covering sonic booms, aircraft design, simulation and future regulation."
s2-e6: "Ansys CTO Prith Banerjee explores the future of engineering simulation, examining AI, foundation models, open source, quantum computing and innovation."
s2-e7: "Michael Mahoney examines what machine learning must get right for science, from data and licensing to foundation models and commercial viability."
s2-e8: "Neil Ashton shares engineering career lessons, mapping roles across industry, consulting and technology while explaining how software and AI change the field."
s2-e9: "Neil Ashton explains why he joined NVIDIA as a Distinguished CAE Architect, what the role covers, and how the move connects AI with engineering simulation."
s2-e10: "Kurt Bergin-Taylor reveals how Tudor Pro Cycling approaches engineering innovation, from aerodynamics and equipment to data, nutrition and performance."
s2-e11: "Neil Ashton explains foundation models for CFD, how they differ from conventional surrogates, and why data, scale and industry dynamics matter today."

s3-e1: "Mike Giles traces a pioneering journey from CFD and Rolls-Royce to computational finance, explaining algorithms, HPC and the choices behind career reinvention."
s3-e2: "Russell Cummings explores hypersonics, aircraft design and aerospace education, discussing CFD, artificial intelligence and advice for future engineers."
s3-e3: "Johannes Brandstetter explains the path toward foundation models for CFD, covering transformers, meshes, temporal dynamics, scaling and physical insight."
s3-e4: "Neil Ashton sets out five skills CAE engineers need in the AI era, from technical learning and data readiness to judgement about building or buying tools."
s3-e5: "Rescale founder Joris Poort explains cloud HPC for engineering, startup growth, enterprise adoption and how AI agents may reshape simulation workflows."
s3-e6: "Brian Launder recounts the origins of modern turbulence modelling, including the k-ε model, wall functions and a career that helped shape practical CFD."
s3-e7: "Neil Ashton revisits five trends shaping CFD, assessing progress in GPUs, AI, cloud computing, digital certification and simulation-industry consolidation."
s3-e8: "Neil Ashton maps the conferences connecting HPC, CAE, machine learning and engineering, explaining where specialists meet, learn and build collaborations."
s3-e9: "Johannes Brandstetter and Siddhartha Mishra examine whether AI can learn fluid physics, covering CFD data, scaling laws, inductive bias and model training."

s4-e1: "Neil Ashton examines how AI agents and foundation models could rewrite CAE/EDA, from automated simulation workflows to ownership, licensing and trust."
s4-e2: "Nathan Kutz explains what works in physics-informed AI, comparing data-driven models, reduced-order methods, human expertise and responsible deployment."
s4-e3: "Ricardo Vinuesa explores AI for fluid mechanics, explainable learning, latent representations, flow control and agents for autonomous scientific discovery."
s4-e4: "Paola Cinnella explores AI for fluid mechanics, turbulence-model uncertainty, AirfRANS, Bayesian methods and the need for rigorous scientific standards."
s4-e5: "Nils Thuerey explores differentiable physics and foundation models, from PhiFlow and neural emulators to online training, open data and simulation agents."
